<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="reset6.css">
  <link rel="stylesheet" href="style6.css">
</head>
<title>가로로 데구르르 구르는 로고</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <div class="container">
            <img src="ASP_logo(0001).png" alt="로고" class="logo">
        </div>
    
        <script src="script.js"></script>
    </header>
<body>
  <div class="header">Antishockpod</div>
  <div class="start-screen">우리는</div>
  <div class="main-content-1">
    <div class="sticky">
      <div class="sticky-title">contents</div>
      <div class="section section-1">
        <div class="title">#1 Exhibition</div>
        <div class="content">
          <img src="Cyan_IC_Int.jpg">
        </div>
      </div>
      <div class="section section-2">
        <div class="title">#2 Exhibition_2</div>
        <div class="content">
          <img src="Cyan_IC_Int.jpg">
        </div>
      </div>
      <div class="section section-3">
        <div class="title">#3 Preservation</div>
        <div class="content">
          <img src="ASP_logo.png">
        </div>
      </div>
      <div class="section section-4">
        <div class="title">#4 comeing soon 😁</div>
        <div class="content">
          <img src="ASP_logo.png">
        </div>
      </div>
    </div>
  </div>

  <script>
    class FolderScroll {
      constructor(wrapper, sticky) {
        this.wrapper = wrapper
        this.sticky = sticky
        this.children = this.sticky.querySelectorAll('.section')
        this.length = this.children.length
        this.headerVh = 6
        this.contentVh = 96 - this.headerVh * this.length
        this.start = 0
        this.end = 0
      }

      init() {
        this.start = this.wrapper.offsetTop + 100
        this.end = this.wrapper.offsetTop + this.wrapper.offsetHeight - innerHeight - 100

        this.children.forEach((child, i) => {
          child.style.bottom = -(100 - this.headerVh * (this.length - i)) + 'vh'
          child.querySelector('.title').style.height = this.headerVh + 'vh'
          child.querySelector('.content').style.height = this.contentVh + 'vh'
        })
      }

      animate() {
        this.children.forEach((child, i) => {
          const unit = (this.end - this.start) / this.length
          const s = this.start + unit * i + 100
          const e = this.start + unit * (i + 1)

          if (scrollY <= s) {
            child.style.transform = `translate3d(0, 0, 0)`
          } else if (scrollY >= e) {
            child.style.transform = `translate3d(0, ${-this.contentVh}%, 0)`
          } else {
            child.style.transform = `translate3d(0, ${(scrollY - s) / (unit - 100) * (-this.contentVh)}%, 0)`
          }
        })
      }
    }
    
    const mainContent1 = document.querySelector('.main-content-1')
    const sticky = document.querySelector('.sticky')
    const folderScroll = new FolderScroll(mainContent1, sticky)
    folderScroll.init()

    window.addEventListener('resize', () => {
      folderScroll.init()
    })
    window.addEventListener('scroll', () => {
      folderScroll.animate()
    })
  </script>
</body>
</html>
